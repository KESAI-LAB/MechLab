name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python compile check
        run: python -m compileall -q app run_gui.pyw
      - name: Bash syntax check
        run: find engine -name '*.sh' -print0 | xargs -0 -n1 bash -n
